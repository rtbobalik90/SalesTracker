<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Tracker</title></head>
<body style="background:#080808;color:#fff;font-family:system-ui;padding:32px">
<p>Returning to Sales Tracker…</p>
<script>
(function(){
  var parts=location.pathname.split('/').filter(Boolean);
  var base=parts.length?('/'+parts[0]+'/'):'/';
  location.replace(base+location.search+location.hash);
})();
</script></body></html>
