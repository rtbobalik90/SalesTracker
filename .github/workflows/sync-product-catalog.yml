name: Sync product catalog and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-product-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Build website product catalog
        run: python scripts/sync_product_catalog.py

      - name: Save catalog revision
        run: |
          if git diff --quiet -- product-catalog.json; then
            echo "Catalog has not changed."
          else
            git config user.name "tcp-product-catalog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add product-catalog.json
            git commit -m "Update website product catalog"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
